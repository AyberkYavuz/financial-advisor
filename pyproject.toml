[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forinvest"
version = "1.0.0"
description = "Multi-agent financial intelligence system"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.9",
    "langchain==1.3.8",
    "langchain-core==1.5.6",
    "langchain-openai==1.3.3",
    "langchain-anthropic==1.5.6",
    "langchain-google-genai==4.3.4",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "sentence-transformers==6.2.0",
    "openai==2.41.1",
    "pypdf==6.21.1",
    "yfinance==1.7.0",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "pydantic>=2.0.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools]
# Only the `graph` package (directory). The top-level `graph.py` entry point is
# loaded by LangGraph via its file path (`./graph.py:graph`), not installed here.
packages = ["graph", "graph.nodes", "graph.utils"]
